name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly as well: the sandbox image installs the current OpenCode, so an
  # OpenCode release can break the "Real OpenCode" job without any commit here.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: ruff + unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from tags, and tests read this
          # checkout's git history (update_check, the image revision).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest

  integration:
    name: Podman integration
    # GitHub's Ubuntu 24.04 image ships podman, usable rootless by the runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: podman --version && podman info --format '{{.Host.Security.Rootless}}'
      - run: pytest tests/integration -v
        env:
          RUN_PODMAN_INTEGRATION: "1"

  opencode:
    name: Real OpenCode (sandbox image + stub LLM)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_opencode_real.py -v
        env:
          RUN_OPENCODE_INTEGRATION: "1"
